<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Isle's own mark: the black glass of the island with the dot in it. The
       wide pill is unreadable at 16px, so this keeps the dot and drops the pill. -->
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5c9e"/>
      <stop offset="50%" stop-color="#ffc43d"/>
      <stop offset="100%" stop-color="#5ac7ff"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0a0a0c"/>
  <circle cx="32" cy="32" r="15" fill="url(#d)"/>
</svg>
